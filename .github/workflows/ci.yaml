name: CI - ReVeste Kids

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Backend has no lint/build script: validate its JS and run isolated tests.
      - name: Syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done < <(find . -path './node_modules' -prune -o -name '*.js' -type f -print0)
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Test-only placeholders. Never use Atlas/GitHub secrets for this job.
      MONGODB_URI: mongodb://example.invalid/reveste_ci
      JWTSECRET: ci-placeholder-not-a-real-secret
      FRONTEND_PORT: '18080'
      BACKEND_PORT: '14001'
      COMPOSE_PROJECT_NAME: reveste-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compose validation (without printing environment values)
        run: docker compose -f compose.yaml -f compose.ci.yaml config --quiet
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          load: true
          push: false
          tags: reveste-kids/backend:local
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: reveste-kids/frontend:local
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Verify image runtime and absence of env files
        run: |
          docker run --rm --entrypoint node reveste-kids/backend:local -e "require('bcrypt').hashSync('smoke',4);if(require('fs').existsSync('/app/.env'))process.exit(1)"
          docker run --rm --entrypoint sh reveste-kids/frontend:local -c 'test ! -e /app/.env && test -f /usr/share/nginx/html/index.html'
      - name: Verify Docker bootstrap policy without network access
        run: >-
          docker run --rm --network none
          --mount "type=bind,source=${{ github.workspace }}/backend/tests/docker-config.test.js,target=/app/tests/docker-config.test.js,readonly"
          --entrypoint node reveste-kids/backend:local --test tests/docker-config.test.js
      - name: Start offline Compose smoke test
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --no-build --wait --wait-timeout 120
      - name: Verify SPA, HTTP and Socket.IO
        run: docker compose -f compose.yaml -f compose.ci.yaml exec -T backend node tests/docker-verify.mjs
      - name: Diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --tail=100
      - name: Stop only this CI project
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down
